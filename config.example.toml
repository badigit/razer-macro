# Razer Macro — конфигурация.
# Копия создаётся автоматически рядом с exe при первом запуске.
# После правки: меню в трее -> «Перечитать конфиг».

[keyboard]
# BlackWidow Ultimate 2013. Свою модель можно найти так:
#   razer-macro.exe --list
vendor_id = "0x1532"
product_id = "0x011A"

[binds]
# Кнопки маркированы снизу вверх: M1 — нижняя, M5 — верхняя.
# Значение — комбинация клавиш: ^=Ctrl !=Alt +=Shift #=Win,
# {NAME} — именованная клавиша ({PRINTSCREEN}, {F13}, {VOLUME_UP}, ...).
M1 = "^+{PRINTSCREEN}"
M3 = "{PRINTSCREEN}"
M5 = "#+s"

# Запуск программы вместо клавиш — префикс run:
# M4 = "run:notepad.exe"

# Вместо имени можно указать сырой код кнопки:
# 0x21 = "{VOLUME_UP}"
