name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller==6.20.0

      - name: Build folder variant
        run: python -m PyInstaller --clean --noconfirm razer-macro-dir.spec

      - name: Build single-file variant
        run: python -m PyInstaller --noconfirm razer-macro.spec

      - name: Smoke test
        # exe собран как windowed, поэтому проверяем не вывод, а код возврата
        run: |
          foreach ($exe in @("dist\razer-macro\razer-macro.exe", "dist\razer-macro.exe")) {
            $p = Start-Process -FilePath $exe -ArgumentList '--list' -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "$exe --list вернул $($p.ExitCode)" }
          }

      - name: Package
        run: |
          copy config.example.toml dist\razer-macro\
          copy README.md dist\razer-macro\
          copy README.ru.md dist\razer-macro\
          copy LICENSE dist\razer-macro\
          Compress-Archive -Path dist\razer-macro\* -DestinationPath razer-macro-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: razer-macro-windows-x64
          path: razer-macro-windows-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            razer-macro-windows-x64.zip
            dist/razer-macro.exe
          generate_release_notes: true
